name: Windows tests
# запускается также по push (on.push) и вручную (workflow_dispatch)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: windows-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ps-unit:
    name: Unit tests (PowerShell 5.1 + pwsh 7)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: windows-unit.ps1 (PS 5.1)
        run: ./tests/windows-unit.ps1
      - name: opencode-unit.ps1 (PS 5.1)
        if: always()
        run: ./tests/opencode-unit.ps1
      - name: windows-bat-smoke.ps1 (PS 5.1)
        if: always()
        run: ./tests/windows-bat-smoke.ps1
      - name: windows-bat-cli.ps1 (PS 5.1)
        if: always()
        run: ./tests/windows-bat-cli.ps1
      - name: windows-unit.ps1 (pwsh 7)
        if: always()
        shell: pwsh
        run: ./tests/windows-unit.ps1
      - name: opencode-unit.ps1 (pwsh 7)
        if: always()
        shell: pwsh
        run: ./tests/opencode-unit.ps1
      - name: windows-bat-smoke.ps1 (pwsh 7)
        if: always()
        shell: pwsh
        run: ./tests/windows-bat-smoke.ps1
      - name: windows-bat-cli.ps1 (pwsh 7)
        if: always()
        shell: pwsh
        run: ./tests/windows-bat-cli.ps1

  server-smoke:
    name: Server smoke (real llama-server.exe)
    runs-on: windows-latest
    needs: ps-unit
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Download llama.cpp win-cpu binary (pinned SHA256, TLS)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ver = ((Get-Content lib\versions.inc | Where-Object { $_ -match '^LLAMA_VERSION=' }) -split '=',2)[1]
          $expected = ((Get-Content lib\versions.inc | Where-Object { $_ -match '^LLAMA_WIN_CPU_SHA256=' }) -split '=',2)[1]
          if (-not $ver) { throw 'LLAMA_VERSION not found in lib\versions.inc' }
          if (-not $expected) { throw 'LLAMA_WIN_CPU_SHA256 not found in lib\versions.inc' }
          $zip = "$env:TEMP\llama-win-cpu.zip"
          "Downloading llama.cpp $ver (win-cpu-x64)"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/ggml-org/llama.cpp/releases/download/$ver/llama-$ver-bin-win-cpu-x64.zip" -OutFile $zip
          $size = (Get-Item $zip).Length
          if ($size -lt 1MB) { throw "Downloaded file too small ($size bytes) - probably an HTML/error page" }
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $expected) { throw "SHA256 mismatch for llama zip: got $actual, expected $expected" }
          New-Item -ItemType Directory -Force bin\win-cpu | Out-Null
          New-Item -ItemType Directory -Force "$env:TEMP\llama-bin" | Out-Null
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\llama-bin" -Force
          # архив без верхнего каталога: ищем папку с llama-server.exe и копируем содержимое (dll-зависимости ggml)
          $server = Get-ChildItem "$env:TEMP\llama-bin" -Recurse -Filter 'llama-server.exe' | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe not found in archive" }
          Copy-Item "$($server.DirectoryName)\*" bin\win-cpu\ -Recurse -Force
          Get-Item bin\win-cpu\llama-server.exe | Select-Object Name, Length
      - name: Download small test model (pinned SHA256 from HF)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory -Force models | Out-Null
          $out = 'models\qwen2.5-coder-0.5b-instruct-q4_k_m.gguf'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf' -OutFile $out
          $mExpected = ((Get-Content lib\versions.inc | Where-Object { $_ -match '^LLAMA_TEST_MODEL_SHA256=' }) -split '=',2)[1]
          if (-not $mExpected) { throw 'LLAMA_TEST_MODEL_SHA256 not found in lib\versions.inc' }
          $mActual = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          if ($mActual -ne $mExpected) { throw "SHA256 mismatch for test model: got $mActual, expected $mExpected" }
          Get-Item $out | Select-Object Name, Length
      - name: Boot server with autotune params and check /health
        run: |
          $kv = & powershell -NoProfile -ExecutionPolicy Bypass -File lib\autotune.ps1 -Model 'qwen2.5-coder-0.5b-instruct-q4_k_m.gguf' -Backend cpu -ModelDir models
          $vars = @{}
          foreach ($line in $kv) { if ($line -match '^([^=]+)=(.+)$') { $vars[$matches[1]] = $matches[2] } }
          $ctx = $vars['LLM_CTX']; $thr = $vars['LLM_THREADS']; $port = 8080
          Write-Host "Autotune: ctx=$ctx threads=$thr"
          $proc = Start-Process -FilePath 'bin\win-cpu\llama-server.exe' -ArgumentList @('-m','models\qwen2.5-coder-0.5b-instruct-q4_k_m.gguf','-c',$ctx,'-ngl','0','-t',$thr,'-b','256','--host','127.0.0.1','--port',$port) -PassThru -NoNewWindow -RedirectStandardOutput "$env:TEMP\llm-server.log" -RedirectStandardError "$env:TEMP\llm-server.err"
          $ok = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/health" -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          if (-not $ok) {
            Get-Content "$env:TEMP\llm-server.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Get-Content "$env:TEMP\llm-server.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw 'Server did not become healthy in 60s'
          }
          Write-Host 'SMOKE OK: /health = 200'
