name: Linux tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: linux-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: All tests (bash + pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all tests (bash -n + bash suites + PS suites)
        run: bash tests/run-all.sh
