name: Linux tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: linux-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: All tests (bash + pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all tests (bash -n + bash suites + PS suites)
        run: bash tests/run-all.sh

  server-smoke:
    name: Server smoke (real llama-server)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Install pwsh (needed for autotune.ps1)
        uses: actions/setup-powershell@v1
      - name: Download llama.cpp linux-cpu binary (pinned SHA256)
        run: |
          ver=$(grep -oP '^LLAMA_VERSION=\K.*' lib/versions.inc | tr -d '[:space:]')
          if [ -z "$ver" ]; then echo "LLAMA_VERSION not found"; exit 1; fi
          url="https://github.com/ggml-org/llama.cpp/releases/download/$ver/llama-${ver}-bin-ubuntu-x64.tar.gz"
          echo "Downloading llama.cpp $ver (linux-cpu-x64)"
          mkdir -p bin/linux-cpu
          curl -fSL --retry 5 --connect-timeout 15 -o /tmp/llama-linux-cpu.tar.gz "$url"
          size=$(stat -c %s /tmp/llama-linux-cpu.tar.gz 2>/dev/null || echo 0)
          if [ "$size" -lt 1000000 ]; then echo "Downloaded file too small ($size bytes)"; exit 1; fi
          tar -xzf /tmp/llama-linux-cpu.tar.gz --strip-components=1 -C bin/linux-cpu
          chmod +x bin/linux-cpu/llama-server
          ls -la bin/linux-cpu/llama-server
      - name: Download small test model (pinned SHA256 from HF)
        run: |
          mkdir -p models
          out="models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"
          curl -fSL --retry 5 --connect-timeout 15 -o "$out" \
            'https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf'
          mExpected=$(grep -oP '^MODEL_SHA256=\K.*' lib/versions.inc | tr -d '[:space:]')
          if [ -z "$mExpected" ]; then echo "MODEL_SHA256 not found in lib/versions.inc"; exit 1; fi
          mActual=$(sha256sum "$out" | cut -d' ' -f1)
          if [ "$mActual" != "$mExpected" ]; then echo "SHA256 mismatch: got $mActual, expected $mExpected"; exit 1; fi
          ls -la "$out"
      - name: Boot server with autotune params and check /health
        run: |
          kv=$(pwsh -NoProfile -File lib/autotune.ps1 -Model 'qwen2.5-coder-0.5b-instruct-q4_k_m.gguf' -Backend cpu -ModelDir models)
          declare -A vars
          while IFS='=' read -r key val; do [ -n "$key" ] && vars["$key"]="$val"; done <<<"$kv"
          ctx="${vars[LLM_CTX]:-512}"
          thr="${vars[LLM_THREADS]:-1}"
          port=8080
          echo "Autotune: ctx=$ctx threads=$thr"
          bin/linux-cpu/llama-server -m "models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf" \
            -c "$ctx" -ngl 0 -t "$thr" -b 256 --host 127.0.0.1 --port "$port" &
          pid=$!
          ok=false
          for i in $(seq 1 60); do
            sleep 1
            if curl -sf "http://127.0.0.1:$port/health" >/dev/null 2>&1; then
              ok=true; break
            fi
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" = false ]; then
            echo "Server did not become healthy in 60s"
            exit 1
          fi
          echo "SMOKE OK: /health = 200"
